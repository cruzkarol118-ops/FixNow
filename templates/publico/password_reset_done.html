{% extends "base.html" %}
{% block title %}Correo enviado{% endblock %}
{% block content %}
<div class="fx-auth-page">
  <div class="fx-auth">
    <h1>Revisa tu correo</h1>
    <p class="fx-auth__lead">Si ese correo está registrado, te enviamos un enlace para crear una nueva contraseña. Puede tardar unos minutos o caer en spam.</p>
    <a class="btn btn-fx btn-lg w-100" href="{% url 'login' %}">Volver a ingresar</a>
  </div>
</div>
{% endblock %}
